<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Site Fiches RP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .discord-btn {
            background-color: #5865F2;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.3s;
        }
        .discord-btn:hover {
            background-color: #4752C4;
        }
        .discord-btn::before {
            content: "🎮 ";
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Bienvenue sur Site Fiches RP</h1>
        <p>Connectez-vous avec votre compte Discord pour continuer</p>
        
        {% load socialaccount %}
        <a href="{% provider_login_url 'discord' %}" class="discord-btn">
            Se connecter avec Discord
        </a>
    </div>
</body>
</html>
